<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News by Peter</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Noto+Sans+Myanmar:wght@400;600&family=Noto+Serif+Myanmar:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="masthead">
  <h1>News by Peter</h1>
  <p>What happened, why it matters, and how to reason about it.</p>
</header>
<div class="layout">
  <aside class="rail" id="selector"><!-- your role/topic buttons: give each class="chip" --></aside>
  <main class="feed" id="feed"></main>
</div>

  <nav class="filters" aria-label="Feed filters">
    <label><span data-i18n="role">Role</span>
      <select id="role">
        <option value="ir" data-i18n="roleIr">International Relations</option>
        <option value="law" data-i18n="roleLaw">Law</option>
      </select>
    </label>
    <label><span data-i18n="topic">Topic</span>
      <select id="topic">
        <option value="all" data-i18n="allTopics">All topics</option>
      </select>
    </label>
    <label><span data-i18n="language">Language</span>
      <select id="lang">
        <option value="en">English</option>
        <option value="my">မြန်မာ</option>
      </select>
    </label>
  </nav>

  <main id="feed" aria-live="polite">
    <p class="status" data-i18n="loading">Loading news…</p>
  </main>

  <footer class="site-footer" data-i18n="footer">
    Analysis sections are AI-generated from each headline and summary. Check the source before relying on them.
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
